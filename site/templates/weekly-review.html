<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Review Template</title>
    <link rel="stylesheet" href="printable.css">
</head>
<body>
    <div class="template-container">
        <div class="template-header">
            <h1>Weekly Review</h1>
            <div class="subtitle">AI for Journaling &middot; Asdale Dynamics, LLC</div>
        </div>

        <div class="section">
            <label><strong>Week of:</strong> ____________________</label>
        </div>

        <div class="section">
            <h2>Wins</h2>
            <div class="lines">
                <div class="line"></div><div class="line"></div><div class="line"></div>
            </div>
        </div>

        <div class="section">
            <h2>Challenges</h2>
            <div class="lines">
                <div class="line"></div><div class="line"></div><div class="line"></div>
            </div>
        </div>

        <div class="section">
            <h2>Energy &amp; Mood</h2>
            <div class="label-row">
                <div class="label-item"><strong>Most energizing moment:</strong><br><div class="line" style="height:0.5in;"></div></div>
                <div class="label-item"><strong>Most draining moment:</strong><br><div class="line" style="height:0.5in;"></div></div>
            </div>
        </div>

        <div class="section">
            <h2>Looking Ahead</h2>
            <div class="lines">
                <strong>One thing to carry into next week:</strong><br>
                <div class="line"></div>
                <strong>One thing to let go of:</strong><br>
                <div class="line"></div>
            </div>
        </div>

        <div class="footer-note">
            Copyright (c) 2026 Asdale Dynamics, LLC &middot; Printable template for personal use
        </div>
    </div>
</body>
</html>
